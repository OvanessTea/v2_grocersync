name: v2grocersync-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: grocersync-web-dev
    depends_on:
      api:
        condition: service_started
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_pnpm_store:/pnpm/store
      - web_root_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_api_node_modules:/app/apps/api/node_modules
      - web_shared_node_modules:/app/packages/shared/node_modules

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: grocersync-api-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: change-me-in-production
      APP_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/grocersync?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_pnpm_store:/pnpm/store
      - api_root_node_modules:/app/node_modules
      - api_web_node_modules:/app/apps/web/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - api_shared_node_modules:/app/packages/shared/node_modules

  postgres:
    image: postgres:17-alpine
    container_name: grocersync-postgres-dev
    environment:
      POSTGRES_DB: grocersync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocersync"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: grocersync-redis-dev
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

volumes:
  web_pnpm_store:
  web_root_node_modules:
  web_app_node_modules:
  web_api_node_modules:
  web_shared_node_modules:
  api_pnpm_store:
  api_root_node_modules:
  api_web_node_modules:
  api_app_node_modules:
  api_shared_node_modules:
  postgres_data_dev:
  redis_data_dev:
